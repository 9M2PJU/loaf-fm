name: "CI / Auto-Retarget PR to dev"

on:
  pull_request_target:
    types: [opened]
    branches:
      - main

permissions:
  pull-requests: write
  issues: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    # Skip if the PR is a merge from dev into main (release PRs)
    if: github.event.pull_request.head.ref != 'dev'
    steps:
      - name: Retarget PR to dev
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              // Switch base branch from main to dev
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                base: 'dev'
              });

              // Leave a constructive comment for the contributor
              const body = `Hi @${context.payload.pull_request.user.login}! Thanks for your contribution.

              All new features, fixes, and contributor PRs must target our development branch (**\`dev\`**) instead of \`main\`.

              I have automatically changed the target base branch of this PR to **\`dev\`** for you. No further action is needed on your part.`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });

              console.log(`Successfully retargeted PR #${prNumber} to dev.`);
            } catch (error) {
              core.setFailed(`Failed to retarget PR #${prNumber}: ${error.message}`);
            }