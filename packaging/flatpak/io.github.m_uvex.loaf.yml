app-id: io.github.m_uvex.loaf
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: loaf

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.freedesktop.FileManager1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/loaf/cargo

modules:
  - name: loaf
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/loaf /app/bin/loaf
      - install -Dm644 packaging/assets/loaf.desktop /app/share/applications/io.github.m_uvex.loaf.desktop
      - sed -i 's/^Icon=loaf/Icon=io.github.m_uvex.loaf/' /app/share/applications/io.github.m_uvex.loaf.desktop
      - install -Dm644 packaging/flatpak/io.github.m_uvex.loaf.metainfo.xml /app/share/metainfo/io.github.m_uvex.loaf.metainfo.xml
      - install -Dm644 packaging/assets/icons/hicolor/scalable/apps/loaf.svg /app/share/icons/hicolor/scalable/apps/io.github.m_uvex.loaf.svg
      - |
        for sz in 16 32 48 64 128 256 512; do
          if [ -f packaging/assets/icons/hicolor/${sz}x${sz}/apps/loaf.png ]; then
            install -Dm644 packaging/assets/icons/hicolor/${sz}x${sz}/apps/loaf.png /app/share/icons/hicolor/${sz}x${sz}/apps/io.github.m_uvex.loaf.png
          fi
        done
    sources:
      - type: dir
        path: ../..
